name: Build ESP32 Arduino Libs

on:
  workflow_dispatch:
    inputs:
      idf_version:
        description: 'ESP-IDF version (branch/tag)'
        required: true
        default: 'v5.5.5'
      arduino_version:
        description: 'arduino-esp32 version (branch/tag)'
        required: true
        default: '3.3.11'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # 单芯片保险值，全芯片可拉满 360
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3]
    steps:
      - name: Checkout lib-builder
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget curl libssl-dev libncurses-dev \
            flex bison gperf cmake ninja-build ccache jq \
            python3 python3-pip python3-venv

      - name: Build libs for ${{ matrix.target }}
        run: |
          ./build.sh \
            -I ${{ inputs.idf_version }} \
            -A ${{ inputs.arduino_version }} \
            -t ${{ matrix.target }} \
            -b idf-libs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-arduino-libs-${{ matrix.target }}
          path: esp32-arduino-libs/
          if-no-files-found: error
          retention-days: 14
